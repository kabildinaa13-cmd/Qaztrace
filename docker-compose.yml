services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainsentinel -d chainsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: npm run api
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    command: npx vite preview --host 0.0.0.0 --port 5174 --strictPort
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env before running docker compose}
    ports:
      - "5174:5174"
    depends_on:
      - api

volumes:
  postgres_data:
